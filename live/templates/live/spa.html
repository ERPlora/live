<!DOCTYPE html>
<html lang="{{ lang }}" data-ep-palette="{{ palette }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }}</title>
{% for href in assets.css %}  <link rel="stylesheet" href="{{ href }}">
{% endfor %}{% for href in assets.preload %}  <link rel="modulepreload" href="{{ href }}" nonce="{{ csp_nonce }}">
{% endfor %}{% for block in json_blocks %}  <script id="{{ block.id }}" type="application/json" nonce="{{ csp_nonce }}">{{ block.json }}</script>
{% endfor %}{% for src in assets.scripts %}  <script type="module" src="{{ src }}" nonce="{{ csp_nonce }}"></script>
{% endfor %}</head>
<body>
  <div id="app"></div>
</body>
</html>

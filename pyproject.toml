[project]
name = "erplora-live"
version = "0.1.0"
description = "Operations, live queries over SSE and SPA serving shared by the Hub and the SaaS."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-ninja>=1.7.1",
    "psycopg[binary,pool]>=3.3",
    "daphne>=4.2",  # live's runserver command is daphne's
    "markdown>=3.8",  # live.markdown
    "nh3>=0.3",  # sanitises live.markdown's HTML
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# Only the size and function limits of the code: no default rules and no formatter (ruff format leaves every file as
# it is, also one named on the command line).
[tool.ruff]
force-exclude = true

[tool.ruff.format]
exclude = ["*"]

[tool.ruff.lint]
select = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "RUF100"]
# The code's older noqa comments name rules this repo does not check; RUF100 leaves those alone.
external =["BLE001", "E402", "E731", "F401", "TRY004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# Pytest fixtures are arguments: the argument limits do not apply to the tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"]
"**/test_*.py" = ["PLR0913", "PLR0917"]
"**/conftest.py" = ["PLR0913", "PLR0917"]

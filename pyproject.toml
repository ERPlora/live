[project]
name = "erplora-live"
version = "0.1.0"
description = "Operations, live queries over SSE and SPA serving shared by hub-next and saas-next."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-ninja>=1.7.1",
    "psycopg[binary,pool]>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
